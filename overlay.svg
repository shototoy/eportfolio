<svg width="100%" height="100%" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <!-- Dark Chocolate Rose Master Definition -->
    <g id="rose-chocolate">
      <ellipse cx="0" cy="0" rx="30" ry="25" fill="#420100" stroke="#2a0000" stroke-width="2"/>
      <ellipse cx="-15" cy="-6" rx="20" ry="16" fill="#520100" stroke="#2a0000" stroke-width="1.5"/>
      <ellipse cx="15" cy="-6" rx="20" ry="16" fill="#520100" stroke="#2a0000" stroke-width="1.5"/>
      <ellipse cx="0" cy="10" rx="22" ry="18" fill="#620100" stroke="#2a0000" stroke-width="1.5"/>
      <ellipse cx="0" cy="-15" rx="16" ry="12" fill="#320100" stroke="#2a0000" stroke-width="1"/>
      <circle cx="0" cy="0" r="8" fill="#220100" stroke="#2a0000" stroke-width="1"/>
    </g>
    
    <!-- Smaller Maroon Rose for lower corners -->
    <g id="rose-maroon-small">
      <ellipse cx="0" cy="0" rx="15" ry="12" fill="#4a0000" stroke="#2a0000" stroke-width="1.5"/>
      <ellipse cx="-8" cy="-3" rx="10" ry="8" fill="#5a0000" stroke="#2a0000" stroke-width="1"/>
      <ellipse cx="8" cy="-3" rx="10" ry="8" fill="#5a0000" stroke="#2a0000" stroke-width="1"/>
      <ellipse cx="0" cy="5" rx="12" ry="9" fill="#6a0000" stroke="#2a0000" stroke-width="1"/>
      <ellipse cx="0" cy="-8" rx="8" ry="6" fill="#3a0000" stroke="#2a0000" stroke-width="1"/>
      <circle cx="0" cy="0" r="4" fill="#2a0000" stroke="#2a0000" stroke-width="0.8"/>
    </g>
  </defs>
  
  <!-- UPPER LEFT: MASSIVE BED OF ROSES -->
  <g transform="translate(0,0) scale(1.3)">
    <!-- Base Vines -->
    <!-- Path 1: 0,0 -> 300,100 -> 500,200 -->
    <path d="M 0,0 Q 150,80 300,100 Q 450,120 500,200" fill="none" stroke="#2a0000" stroke-width="8" opacity="0.8"/>
    <!-- Path 2: 0,50 -> 200,150 -> 350,300 -->
    <path d="M 0,50 Q 100,100 200,150 Q 300,200 350,300" fill="none" stroke="#2a0000" stroke-width="7" opacity="0.8"/>
    <!-- Path 3: 50,0 -> 150,250 -> 200,450 -->
    <path d="M 50,0 Q 120,120 150,250 Q 180,380 200,450" fill="none" stroke="#2a0000" stroke-width="7" opacity="0.8"/>
    
    <!-- EXTENDED STEMS (Corrected Connections) -->
    <!-- Connected to Path 1 Midpoint (300,100) -->
    <path d="M 300,100 Q 600,60 800,80 Q 900,90 950,120" fill="none" stroke="#2a0000" stroke-width="5" opacity="0.7"/>
    <!-- Connected to Path 1 End (500,200) - WAS DISCONNECTED at 450,120 -->
    <path d="M 500,200 Q 700,180 800,150 Q 900,180 920,200" fill="none" stroke="#2a0000" stroke-width="4" opacity="0.7"/>
    <!-- Connected to Path 2 Midpoint (200,150) -->
    <path d="M 200,150 Q 500,20 700,40" fill="none" stroke="#2a0000" stroke-width="4" opacity="0.6"/>
    
    <!-- Connected to Path 3 End (150,250) actually Path 3 Midpoint is 150,250. This creates a branch. -->
    <path d="M 150,250 Q 220,500 240,550" fill="none" stroke="#2a0000" stroke-width="4" opacity="0.7"/>
    
    <!-- Dense Cluster of Huge Roses -->
    <use href="#rose-chocolate" transform="translate(60, 60) rotate(-15)"/>
    <use href="#rose-chocolate" transform="translate(140, 40) rotate(20)"/>
    <use href="#rose-chocolate" transform="translate(200, 100) rotate(-30)"/>
    <use href="#rose-chocolate" transform="translate(80, 150) rotate(45)"/>
    <use href="#rose-chocolate" transform="translate(160, 200) rotate(-10)"/>
    <use href="#rose-chocolate" transform="translate(260, 160) rotate(15)"/>
    <use href="#rose-chocolate" transform="translate(350, 220) rotate(-25)"/>
    <use href="#rose-chocolate" transform="translate(280, 280) rotate(60)"/>
    <use href="#rose-chocolate" transform="translate(150, 320) rotate(-40)"/>
    <use href="#rose-chocolate" transform="translate(50, 240) rotate(10)"/>
    <use href="#rose-chocolate" transform="translate(220, 380) rotate(25)"/>
    <use href="#rose-chocolate" transform="translate(380, 120) rotate(-5)"/>
    <use href="#rose-chocolate" transform="translate(420, 250) rotate(35)"/>
    <use href="#rose-chocolate" transform="translate(480, 180) rotate(-15)"/>
    
    <!-- Roses on Extended Stems -->
    <use href="#rose-chocolate" transform="translate(600, 60) rotate(10) scale(0.9)"/>
    <use href="#rose-chocolate" transform="translate(750, 130) rotate(-15) scale(0.85)"/>
    <use href="#rose-chocolate" transform="translate(880, 90) rotate(20) scale(0.8)"/>
    
    <!-- Fillers -->
    <use href="#rose-chocolate" transform="translate(110, 100) rotate(90) scale(0.9)"/>
    <use href="#rose-chocolate" transform="translate(190, 260) rotate(-70) scale(0.9)"/>
    <use href="#rose-chocolate" transform="translate(290, 60) rotate(10) scale(0.9)"/>
    <use href="#rose-chocolate" transform="translate(40, 350) rotate(120) scale(0.8)"/>
    <use href="#rose-chocolate" transform="translate(330, 330) rotate(-10) scale(0.8)"/>
    <use href="#rose-chocolate" transform="translate(450, 80) rotate(25) scale(0.8)"/>
    <use href="#rose-chocolate" transform="translate(20, 180) rotate(-45) scale(0.9)"/>
    <use href="#rose-chocolate" transform="translate(240, 25) rotate(180) scale(0.9)"/>
  </g>

  <!-- LOWER LEFT: NEW SMALL BED -->
  <g transform="translate(0, 1080) scale(0.8) rotate(-90)">
    <path d="M 0,0 Q 100,50 200,60" fill="none" stroke="#2a0000" stroke-width="4" opacity="0.6"/>
    <path d="M 0,0 Q 60,80 100,150" fill="none" stroke="#2a0000" stroke-width="4" opacity="0.6"/>
    <path d="M 50,0 Q 120,60 180,100" fill="none" stroke="#2a0000" stroke-width="3" opacity="0.6"/>
    
    <!-- Connected Outgrowths -->
    <path d="M 200,60 Q 230,80 260,100" fill="none" stroke="#2a0000" stroke-width="2.5" opacity="0.5"/>

    <!-- Small Cluster (~8 roses) -->
    <use href="#rose-maroon-small" transform="translate(80, 40) rotate(20)"/>
    <use href="#rose-maroon-small" transform="translate(150, 70) rotate(-30)"/>
    <use href="#rose-maroon-small" transform="translate(50, 100) rotate(45)"/>
    <use href="#rose-maroon-small" transform="translate(200, 60) rotate(10)"/>
    <use href="#rose-maroon-small" transform="translate(120, 130) rotate(-15)"/>
    <use href="#rose-maroon-small" transform="translate(30, 60) rotate(80)"/>
    <use href="#rose-maroon-small" transform="translate(160, 150) rotate(25) scale(0.9)"/>
    <use href="#rose-maroon-small" transform="translate(90, 10) rotate(160) scale(0.9)"/>
  </g>

  <!-- LOWER RIGHT: INCREASED DENSITY -->
  <g transform="translate(1920, 1080) rotate(180) scale(0.8)">
    <path d="M 0,0 Q 100,50 200,60" fill="none" stroke="#2a0000" stroke-width="4" opacity="0.6"/>
    <path d="M 0,0 Q 60,80 100,150" fill="none" stroke="#2a0000" stroke-width="4" opacity="0.6"/>
    <path d="M 50,0 Q 120,60 180,100" fill="none" stroke="#2a0000" stroke-width="3" opacity="0.6"/>
    <path d="M 0,50 Q 80,120 140,180" fill="none" stroke="#2a0000" stroke-width="3" opacity="0.6"/>
    
    <!-- Outgrowing Stems - Connected (Tips at 200,60 | 100,150 | 180,100) -->
    <path d="M 200,60 Q 250,70 300,90" fill="none" stroke="#2a0000" stroke-width="2.5" opacity="0.5"/>
    <path d="M 100,150 Q 120,200 150,250" fill="none" stroke="#2a0000" stroke-width="2.5" opacity="0.5"/>
    <path d="M 180,100 Q 230,130 270,160" fill="none" stroke="#2a0000" stroke-width="2.5" opacity="0.5"/>
    
    <!-- Increased Density Cluster -->
    <use href="#rose-maroon-small" transform="translate(80, 40) rotate(20)"/>
    <use href="#rose-maroon-small" transform="translate(150, 70) rotate(-30)"/>
    <use href="#rose-maroon-small" transform="translate(50, 100) rotate(45)"/>
    <use href="#rose-maroon-small" transform="translate(200, 60) rotate(10)"/>
    <use href="#rose-maroon-small" transform="translate(120, 130) rotate(-15)"/>
    <use href="#rose-maroon-small" transform="translate(30, 60) rotate(80)"/>
    <use href="#rose-maroon-small" transform="translate(220, 100) rotate(-50) scale(0.9)"/>
    <use href="#rose-maroon-small" transform="translate(90, 10) rotate(160) scale(0.9)"/>
    <use href="#rose-maroon-small" transform="translate(160, 150) rotate(25) scale(0.9)"/>
    <use href="#rose-maroon-small" transform="translate(100, 180) rotate(-40) scale(0.9)"/>
    <use href="#rose-maroon-small" transform="translate(250, 80) rotate(15) scale(0.85)"/>
    <use href="#rose-maroon-small" transform="translate(40, 140) rotate(120) scale(0.85)"/>
    <use href="#rose-maroon-small" transform="translate(140, 200) rotate(5) scale(0.85)"/>
    <use href="#rose-maroon-small" transform="translate(280, 140) rotate(-20) scale(0.8)"/>
    <use href="#rose-maroon-small" transform="translate(10, 90) rotate(180) scale(0.8)"/>
  </g>
</svg>
