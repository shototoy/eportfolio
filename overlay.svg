<svg width="100%" height="100%" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5f9ea0;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#4a7c7e;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#5f9ea0;stop-opacity:0.6" />
    </linearGradient>
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#5f9ea0" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Heavy Left Side Background -->
  <rect x="0" y="0" width="800" height="1080" fill="url(#grid)" opacity="0.4"/>
  
  <!-- Dense Left Side Patterns -->
  <g transform="translate(0,0)" filter="url(#glow)">
    <!-- Multiple flowing lines -->
    <path d="M 0,0 Q 100,50 200,100 T 400,50 T 600,150 T 700,100" 
          fill="none" stroke="#5f9ea0" stroke-width="3" opacity="0.6"/>
    <path d="M 0,100 Q 75,125 150,150 T 250,300 T 350,250 T 450,400" 
          fill="none" stroke="url(#blueGradient)" stroke-width="4" opacity="0.7"/>
    <path d="M 0,200 Q 100,250 200,300 T 400,250 T 600,350" 
          fill="none" stroke="#5f9ea0" stroke-width="3" opacity="0.6"/>
    <path d="M 0,400 Q 80,450 160,500 T 320,450 T 480,550" 
          fill="none" stroke="#4a7c7e" stroke-width="3.5" opacity="0.7"/>
    <path d="M 0,600 Q 90,650 180,700 T 360,650 T 540,750" 
          fill="none" stroke="#5f9ea0" stroke-width="3" opacity="0.6"/>
    <path d="M 0,800 Q 100,850 200,900 T 400,850 T 600,950" 
          fill="none" stroke="url(#blueGradient)" stroke-width="4" opacity="0.7"/>
    
    <!-- Vertical lines on left -->
    <line x1="50" y1="0" x2="50" y2="1080" stroke="#5f9ea0" stroke-width="2" opacity="0.4"/>
    <line x1="150" y1="0" x2="150" y2="1080" stroke="#4a7c7e" stroke-width="2" opacity="0.3"/>
    <line x1="250" y1="0" x2="250" y2="1080" stroke="#5f9ea0" stroke-width="2" opacity="0.4"/>
    <line x1="350" y1="0" x2="350" y2="1080" stroke="#4a7c7e" stroke-width="2" opacity="0.3"/>
    <line x1="450" y1="0" x2="450" y2="1080" stroke="#5f9ea0" stroke-width="2" opacity="0.4"/>
    <line x1="550" y1="0" x2="550" y2="1080" stroke="#4a7c7e" stroke-width="2" opacity="0.3"/>
    
    <!-- Dense circles on left -->
    <circle cx="100" cy="100" r="6" fill="#5f9ea0" opacity="0.7"/>
    <circle cx="200" cy="200" r="6" fill="#5f9ea0" opacity="0.7"/>
    <circle cx="300" cy="150" r="6" fill="#4a7c7e" opacity="0.7"/>
    <circle cx="150" cy="300" r="6" fill="#5f9ea0" opacity="0.7"/>
    <circle cx="250" cy="400" r="6" fill="#4a7c7e" opacity="0.7"/>
    <circle cx="350" cy="350" r="6" fill="#5f9ea0" opacity="0.7"/>
    <circle cx="100" cy="500" r="6" fill="#4a7c7e" opacity="0.7"/>
    <circle cx="200" cy="600" r="6" fill="#5f9ea0" opacity="0.7"/>
    <circle cx="300" cy="550" r="6" fill="#4a7c7e" opacity="0.7"/>
    <circle cx="150" cy="700" r="6" fill="#5f9ea0" opacity="0.7"/>
    <circle cx="250" cy="800" r="6" fill="#4a7c7e" opacity="0.7"/>
    <circle cx="350" cy="750" r="6" fill="#5f9ea0" opacity="0.7"/>
    <circle cx="100" cy="900" r="6" fill="#4a7c7e" opacity="0.7"/>
    <circle cx="200" cy="1000" r="6" fill="#5f9ea0" opacity="0.7"/>
    
    <!-- Small particles -->
    <circle cx="80" cy="150" r="3" fill="#5f9ea0" opacity="0.5"/>
    <circle cx="180" cy="250" r="3" fill="#4a7c7e" opacity="0.5"/>
    <circle cx="280" cy="200" r="3" fill="#5f9ea0" opacity="0.5"/>
    <circle cx="130" cy="350" r="3" fill="#4a7c7e" opacity="0.5"/>
    <circle cx="230" cy="450" r="3" fill="#5f9ea0" opacity="0.5"/>
    <circle cx="330" cy="400" r="3" fill="#4a7c7e" opacity="0.5"/>
    <circle cx="80" cy="550" r="3" fill="#5f9ea0" opacity="0.5"/>
    <circle cx="180" cy="650" r="3" fill="#4a7c7e" opacity="0.5"/>
    <circle cx="280" cy="600" r="3" fill="#5f9ea0" opacity="0.5"/>
    <circle cx="130" cy="750" r="3" fill="#4a7c7e" opacity="0.5"/>
    <circle cx="230" cy="850" r="3" fill="#5f9ea0" opacity="0.5"/>
    <circle cx="330" cy="800" r="3" fill="#4a7c7e" opacity="0.5"/>
  </g>

  <!-- Right Side (Lighter) -->
  <g transform="translate(1920, 1080) rotate(180)" filter="url(#glow)">
    <path d="M 0,0 Q 50,50 100,100 T 300,50" 
          fill="none" stroke="#5f9ea0" stroke-width="2" opacity="0.3"/>
    <path d="M 0,50 Q 50,65 100,80 T 200,200" 
          fill="none" stroke="url(#blueGradient)" stroke-width="2.5" opacity="0.4"/>
    <circle cx="100" cy="100" r="4" fill="#4a7c7e" opacity="0.4"/>
    <circle cx="300" cy="50" r="4" fill="#4a7c7e" opacity="0.4"/>
  </g>

  <!-- Horizontal grid lines -->
  <line x1="0" y1="270" x2="1920" y2="270" stroke="#5f9ea0" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="540" x2="1920" y2="540" stroke="#5f9ea0" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="810" x2="1920" y2="810" stroke="#5f9ea0" stroke-width="1" opacity="0.15"/>
</svg>
