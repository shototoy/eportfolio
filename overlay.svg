<svg width="100%" height="100%" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Upper Left: Digital Royal Crown / Circuitry -->
  <g transform="translate(0,0)" filter="url(#glow)">
    <!-- Main Angular Rays -->
    <path d="M 0,0 L 200,100 L 400,50 L 600,150 L 300,200 L 100,250 Z" fill="none" stroke="#ffd60a" stroke-width="2" opacity="0.6"/>
    <path d="M 0,100 L 150,150 L 250,300 L 50,400" fill="none" stroke="#ffd60a" stroke-width="2" opacity="0.5"/>
    <path d="M 100,0 L 250,50 L 450,100 L 550,250" fill="none" stroke="#ffd60a" stroke-width="2" opacity="0.5"/>
    
    <!-- Geometric Accents -->
    <path d="M 200,100 L 220,120 M 400,50 L 420,70 M 300,200 L 320,220" stroke="#cca000" stroke-width="3" opacity="0.8"/>
    <circle cx="200" cy="100" r="4" fill="#ffd60a" opacity="0.8"/>
    <circle cx="400" cy="50" r="4" fill="#ffd60a" opacity="0.8"/>
    <circle cx="600" cy="150" r="4" fill="#ffd60a" opacity="0.8"/>
    
    <!-- Abstract Tech Lines -->
    <path d="M 50,50 L 100,50 L 120,80 L 200,80" fill="none" stroke="#ffd60a" stroke-width="1" opacity="0.4"/>
    <path d="M 20,150 L 50,180 L 100,180" fill="none" stroke="#ffd60a" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Lower Right: Ascending Geometric Structure -->
  <g transform="translate(1920, 1080) rotate(180)" filter="url(#glow)">
    <!-- Main Structure -->
    <path d="M 0,0 L 100,100 L 300,50 L 500,150 L 200,250 L 50,300 Z" fill="none" stroke="#ffd60a" stroke-width="2" opacity="0.6"/>
    <path d="M 0,50 L 100,80 L 200,200 L 50,350" fill="none" stroke="#ffd60a" stroke-width="2" opacity="0.5"/>
    
    <!-- Accents -->
    <circle cx="100" cy="100" r="4" fill="#cca000" opacity="0.8"/>
    <circle cx="300" cy="50" r="4" fill="#cca000" opacity="0.8"/>
    <circle cx="500" cy="150" r="4" fill="#cca000" opacity="0.8"/>
    
    <!-- Hexagonal hints -->
    <path d="M 100,100 L 120,130 L 150,130 L 170,100" fill="none" stroke="#ffd60a" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Floating Particles/Stars -->
  <circle cx="250" cy="150" r="1.5" fill="#ffd60a" opacity="0.6"/>
  <circle cx="150" cy="250" r="1.5" fill="#ffd60a" opacity="0.6"/>
  <circle cx="350" cy="80" r="1" fill="#ffd60a" opacity="0.5"/>
  <circle cx="1700" cy="900" r="1.5" fill="#ffd60a" opacity="0.6"/>
  <circle cx="1800" cy="950" r="1.5" fill="#ffd60a" opacity="0.6"/>
</svg>
