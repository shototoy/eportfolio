<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      @keyframes float1 { 0% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(50px, -50px) rotate(10deg); } 100% { transform: translate(0, 0) rotate(0deg); } }
      @keyframes float2 { 0% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(-30px, 40px) rotate(-15deg); } 100% { transform: translate(0, 0) rotate(0deg); } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.4; } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .shape { transform-origin: center; opacity: 0.6; }
      .s1 { fill: #C4EEF2; animation: float1 25s infinite ease-in-out; }
      .s2 { fill: #049DD9; animation: float2 30s infinite ease-in-out; opacity: 0.15; }
      .s3 { fill: #F2D6BD; animation: float1 35s infinite ease-in-out reverse; }
      .s4 { fill: #F2AB6D; animation: float2 28s infinite ease-in-out; opacity: 0.2; }
      .s5 { fill: #0487D9; animation: float1 32s infinite ease-in-out; opacity: 0.1; }
      .grid-line { stroke: #049DD9; stroke-width: 1.5; opacity: 0.1; fill: none; }
      .tech-ring { fill: none; stroke: #F2AB6D; stroke-width: 1; opacity: 0.2; }
    </style>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#0487D9" stroke-width="0.8" opacity="0.15"/>
      <circle cx="40" cy="40" r="1" fill="#049DD9" opacity="0.3"/>
    </pattern>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="5" fill="#F2AB6D" opacity="0.6"/>
    </marker>
  </defs>
  
  <rect width="100%" height="100%" fill="#C4EEF2" opacity="0.08"/>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <path d="M-100,540 Q400,200 960,540 T2020,540" class="grid-line" stroke-dasharray="10 5" />
  <path d="M-100,800 Q500,1000 1200,800 T2020,600" class="grid-line" />
  <path d="M200,0 Q300,400 200,1080" class="grid-line" stroke-dasharray="20 10"/>
  <path d="M1700,0 Q1600,600 1700,1080" class="grid-line" stroke-dasharray="20 10"/>

  <circle cx="200" cy="200" r="150" class="shape s1" />
  <polygon points="1700,100 1800,300 1600,250" class="shape s3" />
  <rect x="100" y="800" width="200" height="200" rx="20" class="shape s2" />
  <circle cx="1600" cy="900" r="120" class="shape s4" />
  
  <polygon points="500,500 550,600 450,550" class="shape s5" style="animation-delay: -5s" />
  <polygon points="900,200 950,250 850,250" class="shape s3" style="animation-delay: -10s" />
  <polygon points="1200,700 1250,800 1150,750" class="shape s4" style="animation-delay: -15s" />
  <polygon points="1500,500 1550,550 1450,520" class="shape s2" style="animation-delay: -8s" />
  <circle cx="1100" cy="150" r="40" class="shape s1" style="animation-delay: -2s; opacity: 0.2" />

  <g transform="translate(300, 500)" opacity="0.2">
      <circle cx="0" cy="0" r="60" class="tech-ring" stroke-dasharray="10 5">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="40" class="tech-ring" stroke="#0487D9" stroke-dasharray="2 8" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite" />
      </circle>
      <rect x="-10" y="-10" width="20" height="20" fill="#F2AB6D" opacity="0.5">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
      </rect>
  </g>

  <g transform="translate(1400, 300)" opacity="0.2">
      <rect x="-50" y="-50" width="100" height="100" class="tech-ring" stroke="#049DD9">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="50s" repeatCount="indefinite" />
      </rect>
      <rect x="-30" y="-30" width="60" height="60" class="tech-ring" stroke="#F2AB6D" stroke-dasharray="5 5">
           <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite" />
      </rect>
  </g>
  
  <g opacity="0.15">
    <circle cx="960" cy="540" r="350" fill="none" stroke="#F2AB6D" stroke-width="1" stroke-dasharray="50 20">
      <animateTransform attributeName="transform" type="rotate" from="0 960 540" to="360 960 540" dur="100s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="540" r="380" fill="none" stroke="#0487D9" stroke-width="1.5" stroke-dasharray="10 30">
      <animateTransform attributeName="transform" type="rotate" from="360 960 540" to="0 960 540" dur="80s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="540" r="600" fill="none" stroke="#049DD9" stroke-width="0.5" stroke-dasharray="2 10">
       <animateTransform attributeName="transform" type="rotate" from="0 960 540" to="-360 960 540" dur="200s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <rect x="1800" y="100" width="10" height="10" fill="#F2AB6D" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="100" y="900" width="15" height="15" fill="#0487D9" opacity="0.5">
     <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
