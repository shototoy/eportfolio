<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      @keyframes drift { 0% { transform: translate(0, 0); } 50% { transform: translate(20px, -20px); } 100% { transform: translate(0, 0); } }
      @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 0.6; } 100% { opacity: 0.3; } }
      .shape { opacity: 0.5; animation: drift 10s infinite ease-in-out; }
      .c1 { fill: #9B72AA; }
      .c2 { fill: #F3D1F4; }
      .c3 { fill: #CBF1F5; }
      .c4 { fill: #FFFDF5; }
    </style>
  </defs>
  
  <rect width="100%" height="100%" fill="#FFFDF5"/>
  
  <g opacity="0.6">
      <rect x="0" y="0" width="200" height="200" class="c3 shape" style="animation-delay: 0s"/>
      <polygon points="200,0 400,0 200,200" class="c1 shape" style="animation-delay: -2s"/>
      <rect x="100" y="200" width="150" height="150" class="c2 shape" style="animation-delay: -5s"/>
      <polygon points="500,100 600,300 400,250" class="c3 shape" style="animation-delay: -3s"/>
      
      <rect x="1600" y="800" width="300" height="300" class="c1 shape" style="animation-delay: -7s; opacity: 0.2"/>
      <polygon points="1500,800 1700,600 1800,800" class="c2 shape" style="animation-delay: -1s"/>
      
      <rect x="800" y="400" width="100" height="100" class="c3 shape" style="animation-delay: -4s"/>
      <polygon points="900,400 1000,500 900,600 800,500" class="c1 shape" style="animation-delay: -6s; opacity: 0.3"/>
      
      <rect x="1200" y="100" width="200" height="200" class="c2 shape" style="animation-duration: 15s"/>
      <polygon points="0,800 200,1080 0,1080" class="c3 shape" style="opacity: 0.6"/>
      
      <rect x="50" y="600" width="80" height="80" class="c1 shape" style="animation-duration: 12s"/>
      <circle cx="1500" cy="200" r="100" fill="#CBF1F5" opacity="0.3" class="shape"/>

      <!-- New Added Details -->
      <polygon points="1000,100 1100,50 1050,150" class="c1 shape" style="animation-delay: -8s; opacity: 0.4"/>
      <rect x="1400" y="500" width="60" height="60" class="c2 shape" style="animation-delay: -2.5s"/>
      <circle cx="300" cy="800" r="50" fill="#9B72AA" opacity="0.1" class="shape" style="animation-duration: 20s"/>
      <polygon points="600,600 700,600 650,700" class="c3 shape" style="animation-delay: -1s; opacity: 0.5"/>
      <rect x="1800" y="200" width="120" height="120" class="c2 shape" style="animation-delay: -9s"/>
      <polygon points="50,400 150,350 100,500" class="c3 shape" style="animation-delay: -3s; opacity: 0.3"/>
      <rect x="900" y="900" width="200" height="100" class="c1 shape" style="animation-delay: -11s; opacity: 0.2"/>
      <circle cx="1200" cy="600" r="40" fill="#F3D1F4" opacity="0.4" class="shape"/>
      <polygon points="1600,0 1700,0 1600,100" class="c3 shape"/>
      <rect x="400" y="900" width="50" height="50" class="c2 shape" style="animation-delay: -5s"/>
      <polygon points="200,500 250,550 200,600" class="c1 shape" style="opacity:0.3"/>
  </g>
  
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <circle cx="20" cy="20" r="1" fill="#9B72AA" opacity="0.2"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" />
</svg>
